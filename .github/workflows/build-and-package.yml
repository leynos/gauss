---
name: Build and Package

'on':
  workflow_call:
    inputs:
      platform:
        description: Target platform identifier (linux or windows or macos)
        required: true
        type: string
      target:
        description: Rust target triple to compile for
        required: true
        type: string
      bin-name:
        description: Name of the binary to build
        required: true
        type: string
      version:
        description: Version string used for packaging
        required: true
        type: string
      artifact-name:
        description: Name used when uploading workflow artefacts
        required: true
        type: string
      should-upload-workflow-artifacts:
        description: Whether workflow artefacts should be uploaded
        required: true
        type: boolean
      stage-target:
        description: Key used to look up staged artefacts
        required: false
        type: string
      msi-arch:
        description: Architecture identifier for Windows MSI packaging
        required: false
        type: string
      artifact-suffix:
        description: Suffix appended to macOS package filenames
        required: false
        type: string
      wix-extension-version:
        description: >-
          WiX Toolset extension version for Windows packaging. Empty lets the
          packaging action match the installed WiX CLI's major version.
        required: false
        default: ''
        type: string

# There is no `runner` input. The build standard's reachability contract proves
# which operating system each job runs on, and it accepts only a literal label
# or an exact `${{ matrix.<field> }}`. A runner supplied through
# `workflow_call` cannot be proven, so each platform is its own job with a
# literal label, and a job-level `if` selects it from `inputs.platform`. The
# macOS job keeps one matrix row per architecture because the two need
# different hosts: `macos-15` is Apple silicon and `macos-15-intel` is the only
# image that builds x86_64 natively.
jobs:
  build-linux:
    if: inputs.platform == 'linux'
    name: Build linux artefacts
    runs-on: ubuntu-latest
    env:
      BIN_NAME: ${{ inputs['bin-name'] }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633
        # v4.1.2

      - name: Generate man page
        id: man_page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          path="dist/${BIN_NAME}.1"
          if command -v pandoc &>/dev/null; then
            pandoc docs/users-guide.md -s -t man \
              -M title="${BIN_NAME}" \
              -M section=1 \
              -M header="User Commands" \
              -o "$path"
            echo "path=$path" >>"$GITHUB_OUTPUT"
          else
            # `linux-packages` rejects a `man-paths` entry that does not
            # exist, so report the absence and let the packager omit the
            # page rather than failing the build.
            echo "::warning::pandoc not available, skipping man page generation"
            echo "path=" >>"$GITHUB_OUTPUT"
          fi

      - name: Install Linux system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinput-dev \
            libxcb-xkb-dev \
            libxcb-cursor-dev \
            libxcb-shm0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Build release binary
        uses: >-
          leynos/shared-actions/.github/actions/rust-build-release@81374b6f183e59f0570ad36217ded90d3240fda6
        with:
          target: ${{ inputs.target }}
          bin-name: ${{ inputs['bin-name'] }}
          # The man page comes from `pandoc` above, not from `clap_mangen` or a
          # build script, so the action's own discovery would fail the build
          # looking for a page that never exists.
          skip-man-page-discovery: 'true'

      - name: Package Linux artefacts
        uses: >-
          leynos/shared-actions/.github/actions/linux-packages@81374b6f183e59f0570ad36217ded90d3240fda6
        with:
          project-dir: .
          package-name: ${{ inputs['bin-name'] }}
          bin-name: ${{ inputs['bin-name'] }}
          target: ${{ inputs.target }}
          version: ${{ inputs.version }}
          formats: "deb,rpm"
          man-paths: ${{ steps.man_page.outputs.path }}
          outdir: dist
          # The packager derives no dependencies of its own, so without these
          # the generated metadata declares none and a clean system installs a
          # binary that cannot start. These are the shared libraries the
          # release binary actually links: `libxcb.so.1`,
          # `libxkbcommon.so.0`, `libxkbcommon-x11.so.0` and `libxcb-xkb.so.1`
          # from the X11 stack GPUI uses, plus `libz.so.1`.
          #
          # The two families package those SONAMEs differently, and the names
          # below are the ones each actually ships rather than guesses. Debian
          # splits XCB per extension, so `libxcb-xkb1` carries
          # `libxcb-xkb.so.1`. Fedora and EL9 keep `libxcb-xkb.so.1` inside the
          # single `libxcb` package, and both provide `libz.so.1` from `zlib`.
          deb-depends: >-
            libxcb1, libxcb-xkb1, libxkbcommon0, libxkbcommon-x11-0, zlib1g
          rpm-depends: >-
            libxcb, libxkbcommon, libxkbcommon-x11, zlib

      - name: Prune packaging metadata
        shell: bash
        run: rm -rf dist/.man dist/nfpm.yaml

      - name: Upload Linux artefacts
        if: inputs['should-upload-workflow-artifacts']
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        # v4
        with:
          name: ${{ inputs['artifact-name'] }}
          path: dist

  build-windows:
    if: inputs.platform == 'windows'
    name: Build windows artefacts
    runs-on: windows-latest
    env:
      BIN_NAME: ${{ inputs['bin-name'] }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633
        # v4.1.2

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        # v3.1.2
        # No `python-version` input: this revision does not declare one, so
        # passing it only produced an "Unexpected input(s)" warning. Nothing
        # here consumed the value either. The Windows action sets up its own
        # interpreter (`actions/setup-python` pinned to 3.12, then `pip`), and
        # the macOS scripts declare `requires-python = ">=3.12"` and run under
        # `uv`, which resolves a compatible interpreter itself. This step only
        # has to put `uv` on PATH.

      - name: Build release binary
        uses: >-
          leynos/shared-actions/.github/actions/rust-build-release@81374b6f183e59f0570ad36217ded90d3240fda6
        with:
          target: ${{ inputs.target }}
          bin-name: ${{ inputs['bin-name'] }}
          skip-man-page-discovery: 'true'

      - name: Stage artefacts
        id: stage
        uses: >-
          leynos/shared-actions/.github/actions/stage-release-artefacts@81374b6f183e59f0570ad36217ded90d3240fda6
        with:
          config-file: .github/release-staging.toml
          target: ${{ inputs['stage-target'] }}
          normalize-windows-paths: 'true'

      - name: Capture staged paths
        id: stage_paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "binary_path=${{ steps.stage.outputs['binary-path'] }}"
            echo "man_path=${{ steps.stage.outputs['man-path'] }}"
            echo "license_path=${{ steps.stage.outputs['license-path'] }}"
          } >>"$GITHUB_OUTPUT"

      - name: Build Windows installer package
        id: package_windows
        uses: >-
          leynos/shared-actions/.github/actions/windows-package@81374b6f183e59f0570ad36217ded90d3240fda6
        with:
          product-name: ${{ inputs['bin-name'] }}
          manufacturer: df12 Productions
          install-dir-name: ${{ inputs['bin-name'] }}
          application-path: ${{ steps.stage_paths.outputs.binary_path }}
          license-rtf-path: ${{ steps.stage_paths.outputs.license_path }}
          architecture: ${{ inputs['msi-arch'] }}
          version: ${{ inputs.version }}
          output-basename: ${{ inputs['bin-name'] }}
          output-directory: dist
          license-plaintext-path: LICENSE
          # The outer "Upload Windows artefacts" step uploads `dist` under an
          # architecture-specific name. Letting the action also upload would
          # duplicate the MSI and, because both matrix legs share its default
          # `msi` name, collide under `upload-artifact@v4`.
          upload-artefact: 'false'
          wix-extension-version: ${{ inputs['wix-extension-version'] }}

      # Both installers are written to `dist`, and staging also places its
      # directory there (see `dist_dir` in `.github/release-staging.toml`).
      # A literal `dist` path also lets the CV-005 contract prove the upload
      # cannot select a coverage report; an `${{ steps.*.outputs.* }}` path
      # is unresolvable, so the contract refuses it.
      - name: Upload Windows artefacts
        if: inputs['should-upload-workflow-artifacts']
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        # v4
        with:
          name: ${{ inputs['artifact-name'] }}
          path: dist

  build-macos:
    if: inputs.platform == 'macos'
    name: Build macos artefacts
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      BIN_NAME: ${{ inputs['bin-name'] }}
      VERSION: ${{ inputs.version }}
    steps:
      # Each architecture is built only for the target the caller asked for.
      # Both rows would otherwise run for any macOS call and rebuild the same
      # artefact twice, on the wrong host for one of them.
      - uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633
        if: inputs.target == matrix.target
        # v4.1.2

      - name: Install uv
        if: inputs.target == matrix.target
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        # v3.1.2
        # See the Windows job's note: this revision takes no `python-version`.

      - name: Build release binary
        if: inputs.target == matrix.target
        uses: >-
          leynos/shared-actions/.github/actions/rust-build-release@81374b6f183e59f0570ad36217ded90d3240fda6
        with:
          target: ${{ inputs.target }}
          bin-name: ${{ inputs['bin-name'] }}
          skip-man-page-discovery: 'true'

      - name: Stage artefacts
        if: inputs.target == matrix.target
        id: stage
        uses: >-
          leynos/shared-actions/.github/actions/stage-release-artefacts@81374b6f183e59f0570ad36217ded90d3240fda6
        with:
          config-file: .github/release-staging.toml
          target: ${{ inputs['stage-target'] }}
          normalize-windows-paths: 'false'

      - name: Capture staged paths
        if: inputs.target == matrix.target
        id: stage_paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "binary_path=${{ steps.stage.outputs['binary-path'] }}"
            echo "man_path=${{ steps.stage.outputs['man-path'] }}"
            echo "license_path=${{ steps.stage.outputs['license-path'] }}"
          } >>"$GITHUB_OUTPUT"

      - name: Build macOS installer package
        if: inputs.target == matrix.target
        id: package_macos
        uses: >-
          leynos/shared-actions/.github/actions/macos-package@81374b6f183e59f0570ad36217ded90d3240fda6
        with:
          name: ${{ inputs['bin-name'] }}
          identifier: net.df12.${{ inputs['bin-name'] }}
          binary: ${{ steps.stage_paths.outputs.binary_path }}
          manpage: ${{ steps.stage_paths.outputs.man_path }}
          license-file: LICENSE
          version: ${{ inputs.version }}

      - name: Stamp architecture into package name
        if: inputs.target == matrix.target
        id: rename_macos_pkg
        shell: bash
        env:
          ARCHIVE_SUFFIX: ${{ inputs['artifact-suffix'] }}
          PKG_PATH: ${{ steps.package_macos.outputs.pkg-path }}
        run: |
          set -euo pipefail
          dest="dist/${BIN_NAME}-${VERSION}-${ARCHIVE_SUFFIX}.pkg"
          mkdir -p "$(dirname "$dest")"
          mv "$PKG_PATH" "$dest"

      - name: Upload macOS artefacts
        if: inputs.target == matrix.target && inputs['should-upload-workflow-artifacts']
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        # v4
        with:
          name: ${{ inputs['artifact-name'] }}
          path: dist
