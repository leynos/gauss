---
name: Release Binary

'on':
  push:
    tags:
      - 'v*.*.*'
  workflow_call:
    inputs:
      publish:
        description: >-
          Whether the workflow should publish artefacts to the GitHub release
          associated with the tag. Defaults to `false` when invoked as a
          reusable workflow.
        required: false
        type: boolean
        default: false
      dry-run:
        description: >-
          When `true`, build artefacts without uploading them to GitHub
          releases or workflow artefacts.
        required: false
        type: boolean
        default: false
      # A reusable workflow inherits the caller's event context, so this
      # workflow sees whatever event the caller ran on rather than
      # `workflow_call`. The pinned `determine-release-modes` action only
      # understands `push`, `pull_request`, and `workflow_call`, and raises on
      # anything else. Only `push` and `pull_request` callers are supported;
      # `workflow_dispatch` is not, and the metadata job fails with a message
      # naming this restriction rather than an opaque traceback.
      wix-extension-version:
        description: >-
          Version of the WixToolset.UI.wixext extension to install alongside
          the WiX CLI. Leave empty to let the packaging action match the
          installed CLI's major version.
        required: false
        type: string
        default: ''
    outputs:
      bin_name:
        description: Binary name extracted from Cargo.toml
        value: ${{ jobs.metadata.outputs.bin_name }}
      version:
        description: Crate version resolved from Cargo.toml
        value: ${{ jobs.metadata.outputs.version }}
      should_publish:
        description: Whether artefacts should be published to the release
        value: ${{ jobs.metadata.outputs.should_publish }}
      dry_run:
        description: Whether the workflow is running in dry-run mode
        value: ${{ jobs.metadata.outputs.dry_run }}
      should_upload_workflow_artifacts:
        description: Whether workflow artefact uploads are enabled
        value: ${{ jobs.metadata.outputs.should_upload_workflow_artifacts }}
      wix_extension_version:
        description: >-
          Resolved WixToolset.UI.wixext version compatible with the configured
          WiX CLI toolchain
        value: ${{ jobs.metadata.outputs.wix_extension_version }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ensure_version.outputs['crate-version'] }}
      bin_name: ${{ steps.bin_name.outputs['bin-name'] }}
      should_publish: ${{ steps.publish_intent.outputs.value }}
      dry_run: ${{ steps.release_modes.outputs['dry-run'] }}
      should_upload_workflow_artifacts: >-
        ${{ steps.release_modes.outputs['should-upload-workflow-artifacts'] }}
      wix_extension_version: ${{ steps.wix_extension_version.outputs.value }}
      repo_name: ${{ steps.repo_name.outputs.value }}
    steps:
      - uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633
        # v4.1.2
      - id: repo_name
        name: Determine repository name
        run: echo "value=${GITHUB_REPOSITORY#*/}" >>"$GITHUB_OUTPUT"
      - id: supported_event
        name: Check the inherited event is supported
        shell: bash
        # The pinned action raises on an event it does not model, which
        # surfaces as an opaque traceback. Naming the restriction here turns
        # that into an actionable message, and documents the scope in the
        # workflow itself. `workflow_call` is listed because a direct
        # invocation of this file reports it when dispatched from the
        # Actions UI.
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push|pull_request|workflow_call) ;;
            *)
              echo "::error title=Unsupported trigger::This workflow was" \
                "triggered by '${EVENT_NAME}', which it does not support." \
                "A reusable workflow inherits its caller's event, so a" \
                "caller must itself run on 'push' or 'pull_request'." >&2
              exit 1
              ;;
          esac
      - id: release_modes
        name: Determine release modes
        uses: >-
          leynos/shared-actions/.github/actions/determine-release-modes@ab6505246c6b043b742a225e428e00448c0a37af
        with:
          # Forward the declared inputs. A reusable workflow inherits the
          # caller's event context, so without these overrides a caller that
          # sets `dry-run: true` from a tag push would still publish: the
          # helper treats the inherited `push` event as an instruction to
          # release, and would never see the override.
          publish: ${{ inputs.publish }}
          dry-run: ${{ inputs['dry-run'] }}
      - id: publish_intent
        name: Resolve publish intent
        shell: bash
        # The pinned action returns `true` for any `push` before it reads its
        # `publish` input, so a reusable caller's `publish: false` is ignored
        # when the caller runs on a tag push. The resolver narrows that
        # verdict using this workflow's `inputs` context, which is populated
        # only for a reusable call. It can only turn publishing off, so a
        # direct tag push keeps publishing and a dry run stays a dry run.
        env:
          PINNED_SHOULD_PUBLISH: >-
            ${{ steps.release_modes.outputs['should-publish'] }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          DRY_RUN_INPUT: ${{ inputs['dry-run'] }}
        # The module is stdlib-only, so this uses the runner's built-in Python
        # rather than `uv`. `uv` happens to be present because the pinned
        # `determine-release-modes` action installs it, but depending on a
        # third-party action's side effect would make this step fail the day
        # that action stops installing it.
        run: |
          set -euo pipefail
          python3 scripts/release_publish_intent.py \
            --pinned-should-publish "$PINNED_SHOULD_PUBLISH" \
            --publish-input "$PUBLISH_INPUT" \
            --dry-run-input "$DRY_RUN_INPUT"
      - id: ensure_version
        name: Read package version from Cargo.toml
        uses: >-
          leynos/shared-actions/.github/actions/ensure-cargo-version@ab6505246c6b043b742a225e428e00448c0a37af
        with:
          check-tag: ${{ fromJSON(steps.publish_intent.outputs.value) }}
      - id: wix_extension_version
        name: Resolve WiX extension version
        shell: bash
        # Read the declaring workflow's `inputs` context rather than the
        # caller's event JSON: a reusable workflow keeps the caller's event
        # payload, so `GITHUB_EVENT_PATH` describes the caller's trigger, not
        # this workflow's inputs.
        env:
          INPUT_WIX_EXTENSION_VERSION: ${{ inputs['wix-extension-version'] }}
        run: |
          set -euo pipefail
          # An empty value asks the packaging action to match the installed
          # CLI's major version, which is what keeps the extension compatible
          # with whichever WiX release `dotnet tool` installs.
          echo "value=${INPUT_WIX_EXTENSION_VERSION}" >>"$GITHUB_OUTPUT"
      - id: manifest_path
        name: Resolve Cargo manifest path
        shell: bash
        run: |
          set -euo pipefail
          manifest_path="${CARGO_TOML_PATH:-Cargo.toml}"
          echo "value=$manifest_path" >>"$GITHUB_OUTPUT"
      - id: bin_name
        name: Extract binary name from Cargo.toml
        uses: >-
          leynos/shared-actions/.github/actions/export-cargo-metadata@ab6505246c6b043b742a225e428e00448c0a37af
        with:
          manifest-path: ${{ steps.manifest_path.outputs.value }}
          fields: bin-name
          export-to-env: 'false'

  build-linux:
    needs: metadata
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: linux-amd64
          - target: aarch64-unknown-linux-gnu
            artifact: linux-arm64
    uses: ./.github/workflows/build-and-package.yml
    with:
      platform: linux
      target: ${{ matrix.target }}
      bin-name: ${{ needs.metadata.outputs.bin_name }}
      version: ${{ needs.metadata.outputs.version }}
      artifact-name: ${{ needs.metadata.outputs.repo_name }}-${{ matrix.artifact }}
      should-upload-workflow-artifacts: >-
        ${{ fromJSON(needs.metadata.outputs.should_upload_workflow_artifacts) }}

  build-windows:
    needs: metadata
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            package_arch: amd64
            msi_arch: x64
            target_key: windows-x86_64
          - target: aarch64-pc-windows-msvc
            package_arch: arm64
            msi_arch: arm64
            target_key: windows-aarch64
    uses: ./.github/workflows/build-and-package.yml
    with:
      platform: windows
      target: ${{ matrix.target }}
      bin-name: ${{ needs.metadata.outputs.bin_name }}
      version: ${{ needs.metadata.outputs.version }}
      artifact-name: ${{ needs.metadata.outputs.repo_name }}-windows-${{ matrix.package_arch }}
      should-upload-workflow-artifacts: >-
        ${{ fromJSON(needs.metadata.outputs.should_upload_workflow_artifacts) }}
      stage-target: ${{ matrix.target_key }}
      msi-arch: ${{ matrix.msi_arch }}
      wix-extension-version: ${{ needs.metadata.outputs.wix_extension_version }}

  build-macos:
    needs: metadata
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            artifact_suffix: macos-x86_64
            target_key: macos-x86_64
          - target: aarch64-apple-darwin
            artifact_suffix: macos-arm64
            target_key: macos-aarch64
    uses: ./.github/workflows/build-and-package.yml
    with:
      platform: macos
      target: ${{ matrix.target }}
      bin-name: ${{ needs.metadata.outputs.bin_name }}
      version: ${{ needs.metadata.outputs.version }}
      artifact-name: ${{ needs.metadata.outputs.repo_name }}-${{ matrix.artifact_suffix }}
      should-upload-workflow-artifacts: >-
        ${{ fromJSON(needs.metadata.outputs.should_upload_workflow_artifacts) }}
      stage-target: ${{ matrix.target_key }}
      artifact-suffix: ${{ matrix.artifact_suffix }}

  release:
    if: needs.metadata.outputs.should_publish == 'true'
    permissions:
      contents: write
    needs:
      - metadata
      - build-linux
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633
        # v4.1.2
      - name: Ensure release exists (draft)
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" \
              --draft \
              --verify-tag \
              --notes "Automated release for ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        # v4
        with:
          path: dist
          pattern: ${{ needs.metadata.outputs.repo_name }}-*
      - id: upload_assets
        name: Upload artefacts to release
        uses: >-
          leynos/shared-actions/.github/actions/upload-release-assets@ab6505246c6b043b742a225e428e00448c0a37af
        with:
          release-tag: ${{ github.ref_name }}
          bin-name: ${{ needs.metadata.outputs.bin_name }}
          dist-dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check asset upload errors
        if: steps.upload_assets.outputs.upload-error == 'true'
        run: |
          echo "Error uploading release assets:"
          printf '%s\n' "${{ steps.upload_assets.outputs.error-message }}"
          exit 1
