---
name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      WHITAKER_INSTALLER_REV: 764d5a3199fa2999ae979255e467c9d96fd65780
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup mold linker
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621
      - name: Setup Rust
        uses: >-
          leynos/shared-actions/.github/actions/setup-rust@759da19f0379b6d2d7ddef93b7ad4c3b98154e41
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@759da19f0379b6d2d7ddef93b7ad4c3b98154e41
        with:
          version: "0.6.0"
      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: >-
          DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: '**/*.md'
      - name: Spelling
        run: make spelling
      - name: Workflow contracts
        run: make workflow-contracts
      - name: Install Whitaker
        run: |
          cargo install --locked \
            --git https://github.com/leynos/whitaker \
            --rev "${WHITAKER_INSTALLER_REV}" \
            whitaker-installer
          whitaker-installer
      - name: Lint
        run: make lint
      # Coverage here serves the local ratchet and nothing else: the report is
      # not archived and CodeScene is never called. coverage-main.yml writes
      # the baseline this compares against and owns the CodeScene upload, so
      # the selection below must match that workflow's field for field.
      - name: Test and Measure Coverage
        uses: >-
          leynos/shared-actions/.github/actions/generate-coverage@759da19f0379b6d2d7ddef93b7ad4c3b98154e41
        with:
          features: test-support
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
          publish-artefact: 'false'
