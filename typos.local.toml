# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
# Repository-specific terms are exempted as exact patterns below, not as bare
# accepted words.
accepted = []

[words.corrections]

[patterns]
# Preserve externally defined API names, file names, and tool names without
# weakening prose spelling checks. These patterns match only exact code spans.
ignore = [
    "`(?:AXDescription|AXGroup|AXRole|AXLabel)`",
    "`Catalog(?:::[^`]+)?`",
    "`catalog\\.rs`",
    "`color`",
    "`resize_canvas_not_present_when_maximised`",
    "`resize_canvas_present_when_not_maximised`",
    "flavor = \"current_thread\"",
    "rust-analyzer",
    # The mold linker, named in flags, workflow steps and build notes.
    "-fuse-ld=mold",
    "`mold`",
    "mold linker",
    "`install-mold`",
    "sudo apt-get install mold",
    "mold: fatal: library not found: xcb",
    "switch from mold to lld or ld",
    "once Mold is already in place",
    "especially after Mold is",
    # Level of Detail, as written in the feature plan.
    "\\*\\*LOD \\(Level of Detail\\)\\*\\*",
    # The Spanish Gherkin example.
    "Dado un inventario vac\u00edo",
    "el inventario contiene una calabaza",
    # Preserve documented old-to-new migration pairs and fixed recorded identifiers.
    "(?m)^\\|[ \\t]*`Color`[ \\t]*\\|[ \\t]*`Colour`[ \\t]*\\|[ \\t]*$",
    "(?m)^\\|[ \\t]*`Action::SetStrokeColor`[ \\t]*\\|[ \\t]*`Action::SetStrokeColour`[ \\t]*\\|[ \\t]*$",
    "(?m)^\\|[ \\t]*`Action::SetFillColor`[ \\t]*\\|[ \\t]*`Action::SetFillColour`[ \\t]*\\|[ \\t]*$",
    "(?m)^`Action::identifier\\(\\)`[ \\t\\r\\n]+intentionally[ \\t\\r\\n]+retains[ \\t\\r\\n]+the[ \\t\\r\\n]+recorded[ \\t\\r\\n]+strings[ \\t\\r\\n]+`SetStrokeColor`[ \\t\\r\\n]+and[ \\t\\r\\n]+`SetFillColor`;[ \\t\\r\\n]+persisted[ \\t\\r\\n]+identifiers[ \\t\\r\\n]+are[ \\t\\r\\n]+unchanged\\.[ \\t]*$",
]

[files]
exclude = []
