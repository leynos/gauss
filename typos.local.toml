# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
# Official names and abbreviations: "Azure Architecture Center", the mold
# linker, Level of Detail (LOD), and a Spanish Gherkin example.
accepted = ["Center", "LOD", "Mold", "inventario", "mold"]

[words.corrections]

[patterns]
# Preserve externally defined Rust API and tool names without weakening prose
# spelling checks.
ignore = [
    "`AXDescription`",
    "`AXGroup`",
    "`AXLabel`",
    "`AXRole`",
    "`Catalog`",
    "`Catalog::default_en_gb\\(\\)`",
    "`catalog\\.rs`",
    "`color`",
    "flavor = \"current_thread\"",
    "rust-analyzer",
]

[files]
exclude = []
