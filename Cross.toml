[target.x86_64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH && apt-get update && apt-get install --assume-yes libxcb1-dev:$CROSS_DEB_ARCH libxcb-randr0-dev:$CROSS_DEB_ARCH libxcb-render0-dev:$CROSS_DEB_ARCH libxcb-shape0-dev:$CROSS_DEB_ARCH libxcb-sync-dev:$CROSS_DEB_ARCH libxcb-xfixes0-dev:$CROSS_DEB_ARCH libxcb-xinput-dev:$CROSS_DEB_ARCH libxcb-xkb-dev:$CROSS_DEB_ARCH libxcb-cursor-dev:$CROSS_DEB_ARCH libxcb-shm0-dev:$CROSS_DEB_ARCH libxkbcommon-dev:$CROSS_DEB_ARCH libxkbcommon-x11-dev:$CROSS_DEB_ARCH"
]

